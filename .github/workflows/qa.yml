name: QA

on:
  pull_request:

jobs:
  lint-typecheck-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yahsab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint
      - run: npm --prefix backend exec tsc -- --noEmit
      - run: npm --prefix frontend exec tsc -- --noEmit
      - run: npm --prefix backend run build
      - run: npm --prefix frontend run build
      - run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > backend/.env.test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yahsab_test
      - run: npm --prefix backend test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yahsab_test
